kind = "web"
previewPath = "/"
title = "Data Template Hub"
version = "1.0.0"
id = "artifacts/data-template-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24010

[services.development]
run = "pnpm --filter @workspace/data-template-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/data-template-hub", "run", "build" ]
publicDir = "artifacts/data-template-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24010"
BASE_PATH = "/"
